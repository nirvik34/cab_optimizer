name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend — lint, test, verify it starts
  # ──────────────────────────────────────────────
  backend:
    name: 🐍 Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest httpx

      - name: Lint with Ruff
        run: ruff check . --output-format=github

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Smoke-test — app imports cleanly
        run: python -c "from app import app; print('✅ App imported successfully')"

      - name: Run tests (if any)
        run: |
          if [ -d "tests" ] || ls test_*.py *_test.py 2>/dev/null; then
            pytest -v
          else
            echo "⚠️  No tests found — skipping (add tests/ directory!)"
          fi

  # ──────────────────────────────────────────────
  # 2. Frontend — lint, build
  # ──────────────────────────────────────────────
  frontend:
    name: ⚛️ Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. Deploy — trigger Render deploy on main
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy."
            echo "👉 Add it in: GitHub → Settings → Secrets → Actions"
            echo "   Get it from: Render → Service → Settings → Deploy Hook"
          else
            curl -s -o /dev/null -w "HTTP %{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo ""
            echo "✅ Deploy triggered on Render!"
          fi
